<!doctype html><html lang="en" data-astryx-theme="neutral"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>S2 Directory</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@astryxdesign/core@0.7.11/src/reset.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@astryxdesign/core@0.7.11/dist/astryx.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@astryxdesign/theme-neutral@0.7.11/dist/theme.css">
<link rel="stylesheet" href="brand.css">
<script type="importmap">{"imports":{"react":"https://esm.sh/react@19.2.0","react/jsx-runtime":"https://esm.sh/react@19.2.0/jsx-runtime","react-dom":"https://esm.sh/react-dom@19.2.0","react-dom/client":"https://esm.sh/react-dom@19.2.0/client","htm":"https://esm.sh/htm@3.1.1"}}</script>
<style>
.dir { display: grid; grid-template-columns: 280px 1fr; min-height: calc(100vh - 72px); }
.side { border-right: 1px solid var(--color-border); padding: 32px 16px; position: sticky; top: 72px; align-self: start; height: calc(100vh - 72px); overflow: auto; }
.side h4 { font: 600 12px/1.4 var(--font-family-body); letter-spacing: .14em; text-transform: uppercase; color: var(--color-text-secondary); margin: 24px 12px 8px; }
.side > div:first-child h4 { margin-top: 0; }
.side button { display: block; width: 100%; text-align: left; border: 0; background: none; padding: 10px 12px; border-radius: 8px; font: 500 14px/1.4 var(--font-family-body); color: var(--color-text-primary); cursor: pointer; }
.side button:hover { background: var(--color-background-muted); }
.side button[aria-current] { background: var(--color-accent); color: #14171A; }
.pane { padding: 56px 64px 96px; max-width: 820px; }
.pane .big { font: 600 44px/1.12 var(--font-family-heading); letter-spacing: -.02em; margin: 12px 0 20px; }
.pane .big span { color: #C9A24D; }
.pane p.d { font-size: 18px; color: var(--color-text-secondary); margin: 0; max-width: 600px; }
.next { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-top: 56px; }
.next .k { font-size: 12px; color: var(--color-text-secondary); }
.next .t { font: 600 18px/1.3 var(--font-family-heading); margin-top: 4px; }
.mtabs { display: none; }
@media (max-width: 900px) { .dir { grid-template-columns: 1fr; } .side { display: none; } .mtabs { display: block; position: sticky; top: 72px; z-index: 5; background: var(--color-background-body); padding: 8px 16px 0; } .pane { padding: 32px 16px 64px; } .pane .big { font-size: 32px; } .next { grid-template-columns: 1fr; } }
</style></head><body><div id="root"></div>
<script type="module">
import {C, html, React, SITE, TODO, Header, Footer, mount} from './shell.js';
const ITEMS = [{id:'overview', t:'Overview', g:'Firm'}, ...SITE.practice.map(p => ({id:p.id, t:p.t, g:'Practice areas', p})), ...SITE.offices.map(o => ({id:o.id, t:o.city, g:'Offices', o}))];
function Detail({it}) {
  if (it.id === 'overview') return html`<p class="label">${SITE.cities}</p><h1 class="big">${SITE.h1a}<span>${SITE.h1b}</span></h1><p class="d">${SITE.lead}</p>`;
  if (it.p) return html`<p class="label">Practice area ${it.p.n}</p><h1 class="big">${it.p.t}</h1><p class="d">${it.p.d}</p><ul class="chips">${it.p.tags.map(t => html`<li key=${t}>${t}</li>`)}</ul>`;
  return html`<p class="label">Office · ${it.o.state}</p><h1 class="big">${it.o.city}</h1><div style=${{maxWidth:520}}><${C.MetadataList} columns="single"><${C.MetadataListItem} label="Address">${TODO}</${C.MetadataListItem}><${C.MetadataListItem} label="Phone">${TODO}</${C.MetadataListItem}><${C.MetadataListItem} label="Email">${TODO}</${C.MetadataListItem}></${C.MetadataList}></div>`;
}
function App() {
  const [sel, setSel] = React.useState('overview');
  const i = ITEMS.findIndex(x => x.id === sel), it = ITEMS[i];
  const prev = ITEMS[i - 1], next = ITEMS[i + 1];
  const pick = id => { setSel(id); scrollTo({top: 0}); };
  const groups = [...new Set(ITEMS.map(x => x.g))];
  return html`<${Header} links=${[]}/>
  <div class="mtabs"><${C.TabList} value=${sel} onChange=${pick} hasDivider>${ITEMS.map(x => html`<${C.Tab} key=${x.id} value=${x.id} label=${x.o ? x.t : x.p ? x.t.split(',')[0] : x.t}/>`)}</${C.TabList}></div>
  <div class="dir"><nav class="side" aria-label="Sections">${groups.map(g => html`<div key=${g}><h4>${g}</h4>${ITEMS.filter(x => x.g === g).map(x => html`<button key=${x.id} type="button" aria-current=${sel === x.id ? 'page' : undefined} onClick=${() => pick(x.id)}>${x.t}</button>`)}</div>`)}</nav>
  <main class="pane"><${Detail} it=${it}/>
    <div class="next">${prev ? html`<${C.ClickableCard} label=${'Previous: ' + prev.t} onClick=${() => pick(prev.id)}><div class="k">Previous</div><div class="t">${prev.t}</div></${C.ClickableCard}>` : html`<div></div>`}
    ${next ? html`<${C.ClickableCard} label=${'Next: ' + next.t} onClick=${() => pick(next.id)}><div class="k">Next</div><div class="t">${next.t}</div></${C.ClickableCard}>` : null}</div>
  </main></div><${Footer}/>`;
}
mount(App);
</script></body></html>

<!doctype html><html lang="en" data-astryx-theme="neutral"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>S3 Practice first</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@astryxdesign/core@0.7.11/src/reset.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@astryxdesign/core@0.7.11/dist/astryx.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@astryxdesign/theme-neutral@0.7.11/dist/theme.css">
<link rel="stylesheet" href="brand.css">
<script type="importmap">{"imports":{"react":"https://esm.sh/react@19.2.0","react/jsx-runtime":"https://esm.sh/react@19.2.0/jsx-runtime","react-dom":"https://esm.sh/react-dom@19.2.0","react-dom/client":"https://esm.sh/react-dom@19.2.0/client","htm":"https://esm.sh/htm@3.1.1"}}</script>
<style>
.hero3 .wrap { padding-top: 72px; padding-bottom: 72px; }
.hero3 .top-row { display: flex; justify-content: space-between; align-items: end; gap: 32px; }
.hero3 .hero-title { max-width: 760px; }
.pgrid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-top: 48px; }
.pc .n { font: 600 14px/1 var(--font-family-heading); color: var(--color-text-secondary); }
.pc .t { font: 600 18px/1.3 var(--font-family-heading); margin: 32px 0 8px; }
.pc .more { font-size: 14px; color: #C9A24D; font-weight: 600; }
.sec { padding: 96px 0; }
.sec-head { display: flex; justify-content: space-between; align-items: end; gap: 24px; margin-bottom: 32px; }
@media (max-width: 1100px) { .pgrid { grid-template-columns: 1fr 1fr; } }
@media (max-width: 600px) { .pgrid { grid-template-columns: 1fr; } .hero3 .top-row, .sec-head { flex-direction: column; align-items: start; } .sec { padding: 64px 0; } }
</style></head><body><div id="root"></div>
<script type="module">
import {C, html, React, SITE, TODO, Header, Footer, Arrow, mount, useWide} from './shell.js';
function App() {
  const [open, setOpen] = React.useState(null);
  const [st, setSt] = React.useState('all');
  const p = SITE.practice.find(x => x.id === open);
  const rows = SITE.offices.filter(o => st === 'all' || o.state === st).map(o => ({...o, address: 'to be added', phone: 'to be added', email: 'to be added'}));
  const todo = () => TODO;
  const wide = useWide('(min-width: 701px)');
  return html`<${Header}/>
  <section data-astryx-media="dark" class="dark-band hero3"><div class="wrap">
    <div class="top-row"><div><p class="label">${SITE.cities}</p><h1 class="hero-title">${SITE.h1a}<span>${SITE.h1b}</span></h1><p class="lead">${SITE.lead}</p></div>
      <${C.Button} variant="secondary" size="lg" label="Find an office" href="#offices"/></div>
    <div class="pgrid" id="practice">${SITE.practice.map(x => html`<div class="pc" key=${x.id}><${C.ClickableCard} label=${x.t} padding=${5} height="100%" onClick=${() => setOpen(x.id)}>
      <div class="n">${x.n}</div><div class="t">${x.t}</div><div class="more">Read more</div></${C.ClickableCard}></div>`)}</div>
  </div></section>
  <section class="sec muted" id="offices"><div class="wrap">
    <div class="sec-head"><div><p class="label">Offices</p><h2 class="h2">Where to find us</h2></div>
      <${C.SegmentedControl} value=${st} onChange=${setSt} label="Filter by state"><${C.SegmentedControlItem} value="all" label="All"/><${C.SegmentedControlItem} value="Karnataka" label="Karnataka"/><${C.SegmentedControlItem} value="Kerala" label="Kerala"/></${C.SegmentedControl}></div>
    ${wide ? null : html`<div style=${{display:'grid',gap:12}}>${rows.map(o => html`<${C.Card} key=${o.id} padding=${5}><p class="label">${o.state}</p><h3 class="h2" style=${{fontSize:24,margin:'4px 0 16px'}}>${o.city}</h3>
      <${C.MetadataList} columns="single"><${C.MetadataListItem} label="Address">${TODO}</${C.MetadataListItem}><${C.MetadataListItem} label="Phone">${TODO}</${C.MetadataListItem}><${C.MetadataListItem} label="Email">${TODO}</${C.MetadataListItem}></${C.MetadataList}></${C.Card}>`)}</div>`}
    ${wide && html`<${C.Card} padding=${0}><${C.Table} data=${rows} idKey="id" hasHover columns=${[{key:'city',header:'City'},{key:'state',header:'State'},{key:'address',header:'Address',renderCell:todo},{key:'phone',header:'Phone',renderCell:todo},{key:'email',header:'Email',renderCell:todo}]}/></${C.Card}>`}
  </div></section>
  <${Footer}/>
  <${C.Dialog} isOpen=${!!p} onOpenChange=${v => !v && setOpen(null)} width=${560} padding=${8}>
    ${p && html`<p class="label">Practice area ${p.n}</p><h2 class="h2" style=${{fontSize:28,margin:'8px 0 12px'}}>${p.t}</h2><p style=${{margin:0,color:'var(--color-text-secondary)'}}>${p.d}</p><ul class="chips">${p.tags.map(t => html`<li key=${t}>${t}</li>`)}</ul>
    <div style=${{display:'flex',gap:12,marginTop:24}}><${C.Button} variant="primary" label="Contact an office" href="#offices" onClick=${() => setOpen(null)} endContent=${html`<${Arrow}/>`}/><${C.Button} variant="ghost" label="Close" onClick=${() => setOpen(null)}/></div>`}
  </${C.Dialog}>`;
}
mount(App);
</script></body></html>

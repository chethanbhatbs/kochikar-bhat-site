<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Site layout options</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<!--
  Options page: 2-3 structurally different designs for ONE change, side by side.
  Each option is its own HTML file (opt-1.html ...) built from the product's REAL shell: its stylesheet,
  sidebar/header & real data, with only the changed part different. Edit only the CFG block.
-->
<style>
:root{--page:#E9E5DD;--surface:#fff;--line:#d9d2c5;--text:#211D18;--dim:#6E655A;--faint:#9C9284}
*{box-sizing:border-box}
body{margin:0;background:var(--page);font-family:Inter,system-ui,sans-serif;color:var(--text);font-size:14px}
.bar{position:sticky;top:0;z-index:5;height:56px;display:flex;align-items:center;gap:16px;padding:0 20px;border-bottom:1px solid var(--line);background:#F3EFE8}
.bar h1{font-size:16px;font-weight:600;margin:0}
.bar .sub{font-size:13px;color:var(--dim)}
.bar .sp{flex:1}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--surface)}
.seg button{height:32px;padding:0 14px;border:0;border-right:1px solid var(--line);background:none;font:500 13px Inter;color:var(--dim);cursor:pointer}
.seg button:last-child{border-right:0}
.seg button[aria-pressed=true]{background:var(--text);color:#fff}
.row{padding:20px;display:flex;gap:24px;flex-wrap:wrap;justify-content:center;align-items:flex-start}
.opt{display:flex;flex-direction:column;gap:8px}
.opt h2{font-size:16px;font-weight:600;margin:0}
.opt .what{font-size:13px;color:var(--dim);margin:0;line-height:1.45;min-height:38px}
.dev{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface);display:flex;flex-direction:column}
.chrome{height:30px;flex:none;display:flex;align-items:center;gap:7px;padding:0 12px;background:#EFEBE3;border-bottom:1px solid #E6E0D5;font:500 11px ui-monospace,Menlo,monospace;color:var(--faint)}
.chrome i{width:9px;height:9px;border-radius:5px;background:#d8d1c4}
.dev iframe{border:0;display:block;background:#fff}
body.phone .dev{border-radius:28px}
body.phone .chrome i{display:none}
</style></head><body>
<div class="bar">
  <h1 id="title"></h1><span class="sub" id="sub"></span><span class="sp"></span>
  <div class="seg" id="devSeg"><button aria-pressed="true" data-v="laptop">Laptop</button><button aria-pressed="false" data-v="phone">Phone</button></div>
  <div class="seg" id="themeSeg"><button aria-pressed="true" data-v="light">Light</button><button aria-pressed="false" data-v="dark">Dark</button></div>
</div>
<div class="row" id="row"></div>
<script>
/* ===================== CFG: the only part you edit ===================== */
const CFG = {
  title: "Bhat & Kochikar: layout options",
  sub: "Same text & brand as the live site, built with Astryx components",                         // one line: what is being decided · real data
  options: [                                      // 2-3, each different in STRUCTURE, not colour
    {k: "S1", t: "S1. Hero, then tabs", d: "Short page. Tabs switch between practice areas (fold-out list) & offices (one city at a time).", src: "opt-1.html"},
    {k: "S2", t: "S2. Side directory", d: "A side list of every practice area & office. Each opens on its own screen with Previous / Next.", src: "opt-2.html"},
    {k: "S3", t: "S3. Practice areas first", d: "The 4 practice areas sit in the hero & open in a pop-up. Offices are one table with a state filter (cards on phone).", src: "opt-3.html"},
  ],
  laptop: {w: 1280, h: 860, scale: 0.36},         // rendered size & on-screen scale per frame
  phone:  {w: 390,  h: 780, scale: 1},
  darkClass: "dark",                              // class the product puts on <body> for dark mode
};
/* ======================================================================= */
document.getElementById("title").textContent = CFG.title; document.getElementById("sub").textContent = CFG.sub; document.title = CFG.title;
const row = document.getElementById("row"); let mode = "laptop", dark = false;
function render() {
  const base = CFG[mode], fit = Math.min(base.scale, (window.innerWidth - 40) / base.w);
  const m = {w: base.w, h: base.h, scale: fit};
  row.innerHTML = CFG.options.map(o => `<section class="opt" style="width:${m.w * m.scale}px">
    <h2>${o.t}</h2><p class="what">${o.d}</p>
    <div class="dev" style="width:${m.w * m.scale}px;height:${m.h * m.scale + 30}px"><div class="chrome"><i></i><i></i><i></i>${o.k}</div>
    <div style="width:${m.w * m.scale}px;height:${m.h * m.scale}px;overflow:hidden"><iframe src="${o.src}" title="${o.t}" style="width:${m.w}px;height:${m.h}px;transform:scale(${m.scale});transform-origin:0 0"></iframe></div></div></section>`).join("");
  row.querySelectorAll("iframe").forEach(f => f.addEventListener("load", () => applyTheme(f)));
}
function applyTheme(f) { try { f.contentDocument.body.classList.toggle(CFG.darkClass, dark); } catch (_) {} }
function setSeg(id, v) { document.querySelectorAll("#" + id + " button").forEach(b => b.setAttribute("aria-pressed", b.dataset.v === v)); }
document.getElementById("devSeg").addEventListener("click", e => { const b = e.target.closest("button"); if (!b) return;
  mode = b.dataset.v; setSeg("devSeg", mode); document.body.classList.toggle("phone", mode === "phone"); render(); });
document.getElementById("themeSeg").addEventListener("click", e => { const b = e.target.closest("button"); if (!b) return;
  dark = b.dataset.v === "dark"; setSeg("themeSeg", b.dataset.v); row.querySelectorAll("iframe").forEach(applyTheme); });
let rt; window.addEventListener("resize", () => { clearTimeout(rt); rt = setTimeout(render, 150); });
render();
</script>
</body></html>
